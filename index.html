<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Chat 1GCX</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 dark:bg-slate-800 text-white px-4 py-3 shadow-md flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-lg shadow">
                💬
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Notes Chat 1GCX</h1>
                <p id="sync-status" class="text-xs text-indigo-200">Auto-refresh aktif</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="fetchFromCloud()" title="Muat Ulang Data" class="p-2 hover:bg-indigo-700 dark:hover:bg-slate-700 rounded-full transition">
                <i class="fa-solid fa-rotate text-lg"></i>
            </button>
            <button onclick="syncToCloud()" id="btn-sync" title="Sinkronisasi ke Spreadsheet" class="p-2 hover:bg-indigo-700 dark:hover:bg-slate-700 rounded-full transition relative">
                <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
            </button>
            <button onclick="openSettings()" title="Pengaturan Spreadsheet" class="p-2 hover:bg-indigo-700 dark:hover:bg-slate-700 rounded-full transition">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Chat Container / Daftar Catatan -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <!-- Chat bubbles akan dimuat di sini secara dinamis -->
    </main>

    <!-- Input Area (Chat Box) -->
    <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 p-3 shadow-lg">
        <div class="max-w-2xl mx-auto flex items-end gap-2">
            <div class="flex-1 bg-slate-100 dark:bg-slate-700 rounded-2xl px-4 py-2 border border-slate-300 dark:border-slate-600 focus-within:ring-2 focus-within:ring-indigo-500">
                <input type="text" id="note-title" placeholder="Judul catatan / topik... (Opsional)" class="w-full bg-transparent text-sm font-semibold focus:outline-none mb-1 border-b border-slate-200 dark:border-slate-600 pb-1">
                <textarea id="note-content" rows="1" placeholder="Tulis catatan atau ide di sini..." class="w-full bg-transparent text-sm focus:outline-none resize-none max-h-32" oninput="autoResize(this)"></textarea>
            </div>
            <button onclick="addNewNote()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-11 h-11 rounded-full flex items-center justify-center shadow transition shrink-0">
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </div>
    </footer>

    <!-- Modal Pengaturan URL Web App -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h2 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-link text-indigo-600"></i> Hubungkan ke Spreadsheet
            </h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">
                Masukkan URL Web App dari Google Apps Script spreadsheet Anda agar catatan tersinkron otomatis antar HP dan PC.
            </p>
            <div>
                <label class="block text-xs font-semibold mb-1">Google Apps Script Web App URL</label>
                <input type="text" id="script-url" placeholder="https://script.google.com/macros/s/.../exec" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeSettings()" class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 transition">Batal</button>
                <button onclick="saveSettings()" class="px-4 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition">Simpan & Tarik Data</button>
            </div>
        </div>
    </div>

    <!-- Script Aplikasi -->
    <script>
        let notes = JSON.parse(localStorage.getItem('notes_chat_1gcx')) || [];
        let SCRIPT_URL = localStorage.getItem('notes_script_url') || 'https://script.google.com/macros/s/AKfycbyZtO8hBRVfSUCgtB2V_h65T7Y-TIp3Qve6NpczuDdNBrOlzF2HznLvGbzy_EWW39KaRg/exec';

        window.onload = () => {
            renderNotes();
            if (SCRIPT_URL) {
                fetchFromCloud(true);
            }
            
            // Set Auto-Refresh setiap 10 detik sekali secara senyap di background
            setInterval(() => {
                if (SCRIPT_URL) {
                    fetchFromCloud(true);
                }
            }, 10000);
        };

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        function renderNotes() {
            const container = document.getElementById('chat-container');
            if (notes.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center text-slate-400 mt-20">
                        <i class="fa-regular fa-comment-dots text-4xl mb-2"></i>
                        <p class="text-sm">Belum ada catatan. Mulai ketik catatan pertama Anda di bawah!</p>
                    </div>
                `;
                return;
            }

            // Pertahankan posisi scroll jika user sedang melihat ke atas
            const isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;

            container.innerHTML = notes.map((note) => {
                const dateObj = new Date(note.updatedAt || Date.now());
                const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = dateObj.toLocaleDateString([], { day: 'numeric', month: 'short' });

                return `
                    <div class="flex flex-col items-end">
                        <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%] sm:max-w-[75%] shadow-sm space-y-1 relative group transition-all">
                            ${note.title ? `<div class="font-bold text-sm border-b border-indigo-500/50 pb-1 mb-1">${escapeHtml(note.title)}</div>` : ''}
                            <div class="text-sm whitespace-pre-wrap leading-relaxed">${escapeHtml(note.content)}</div>
                            <div class="flex items-center justify-end gap-2 pt-1">
                                <span class="text-[10px] text-indigo-200">${dateStr}, ${timeStr}</span>
                                <button onclick="deleteNote('${note.id}')" class="text-indigo-200 hover:text-red-300 transition text-xs ml-1" title="Hapus catatan">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (isScrolledToBottom) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function addNewNote() {
            const titleInput = document.getElementById('note-title');
            const contentInput = document.getElementById('note-content');
            
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (!content) return;

            const newNote = {
                id: 'note_' + Date.now(),
                title: title,
                content: content,
                category: 'Chat',
                color: '#indigo',
                isPinned: false,
                updatedAt: new Date().toISOString()
            };

            notes.push(newNote);
            saveAndSync();

            titleInput.value = '';
            contentInput.value = '';
            contentInput.style.height = 'auto';
        }

        function deleteNote(id) {
            if (confirm("Hapus catatan ini?")) {
                notes = notes.filter(n => n.id !== id);
                localStorage.setItem('notes_chat_1gcx', JSON.stringify(notes));
                renderNotes();

                if (SCRIPT_URL) {
                    const statusEl = document.getElementById('sync-status');
                    statusEl.innerText = "Menghapus di Spreadsheet...";
                    
                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'delete', id: id })
                    }).then(() => {
                        syncToCloud();
                    }).catch(err => {
                        statusEl.innerText = "Gagal hapus di cloud";
                    });
                }
            }
        }

        function saveAndSync() {
            localStorage.setItem('notes_chat_1gcx', JSON.stringify(notes));
            renderNotes();
            if (SCRIPT_URL) {
                syncToCloud();
            }
        }

        function openSettings() {
            document.getElementById('script-url').value = SCRIPT_URL;
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            SCRIPT_URL = document.getElementById('script-url').value.trim();
            localStorage.setItem('notes_script_url', SCRIPT_URL);
            closeSettings();
            if (SCRIPT_URL) {
                fetchFromCloud(false);
            }
        }

        function syncToCloud() {
            if (!SCRIPT_URL) return;
            const statusEl = document.getElementById('sync-status');
            statusEl.innerText = "Menyinkronkan...";

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'sync', notes: notes })
            }).then(() => {
                statusEl.innerText = "Auto-refresh aktif";
            }).catch(err => {
                statusEl.innerText = "Gagal sinkron (Mode Offline)";
            });
        }

        function fetchFromCloud(isBackground = false) {
            if (!SCRIPT_URL) return;
            const statusEl = document.getElementById('sync-status');
            if (!isBackground) statusEl.innerText = "Memuat data...";

            fetch(SCRIPT_URL + '?action=read')
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success' && Array.isArray(res.data)) {
                        // Cek apakah ada perubahan data sebelum re-render agar kursor/scroll nyaman
                        if (JSON.stringify(notes) !== JSON.stringify(res.data)) {
                            notes = res.data;
                            localStorage.setItem('notes_chat_1gcx', JSON.stringify(notes));
                            renderNotes();
                        }
                        statusEl.innerText = "Auto-refresh aktif";
                    }
                })
                .catch(() => {
                    if (!isBackground) statusEl.innerText = "Menggunakan data lokal";
                });
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
